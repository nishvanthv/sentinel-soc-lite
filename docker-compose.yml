services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [sentinel_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  sentinel_pg:
